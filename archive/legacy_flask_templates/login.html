<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.18;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 320px;
            height: 320px;
            background: #2563eb;
            top: -90px;
            left: -90px;
        }

        body::after {
            width: 340px;
            height: 340px;
            background: #7c3aed;
            right: -120px;
            bottom: -120px;
        }

        .page-wrap {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 35px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            color: #93c5fd;
            text-decoration: none;
            font-size: 14px;
            line-height: 1.4;
            transition: 0.3s ease;
        }

        .back-link:hover {
            color: #bfdbfe;
            text-decoration: underline;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: clamp(24px, 4vw, 28px);
            line-height: 1.2;
            word-break: break-word;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;
            border: none;
            outline: none;
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255,255,255,0.95);
            color: #0f172a;
            transition: 0.3s ease;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .input-group input:focus {
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
            transform: translateY(-1px);
        }

        .btn {
            width: 100%;
            padding: 13px 14px;
            background: #2563eb;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.85;
            cursor: not-allowed;
            transform: none;
        }

        .btn-loader {
            width: 17px;
            height: 17px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            display: none;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        .btn.loading .btn-loader {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            background: rgba(255, 0, 0, 0.15);
            color: #ffb4b4;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 14px;
            }

            .page-wrap {
                max-width: 500px;
            }

            .login-box {
                padding: 30px 24px;
            }
        }

        @media (max-width: 520px) {
            body {
                align-items: flex-start;
                padding: 16px 10px;
            }

            .page-wrap {
                max-width: 100%;
            }

            .login-box {
                padding: 24px 18px;
                border-radius: 14px;
            }

            .back-link {
                font-size: 13px;
                margin-bottom: 16px;
            }

            .input-group input,
            .btn {
                font-size: 15px;
            }
        }

        @media (max-width: 380px) {
            .login-box {
                padding: 20px 14px;
            }

            .login-box h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="login-box">
            <a href="/" class="back-link">← Back to Home</a>

            <h2>Login</h2>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login" id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    <span class="btn-text">Login</span>
                    <span class="btn-loader"></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");

        loginForm.addEventListener("submit", function () {
            loginBtn.disabled = true;
            loginBtn.classList.add("loading");
        });
    </script>
</body>
</html>
